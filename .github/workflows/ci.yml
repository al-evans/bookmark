name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: this workflow never needs to write to the repo.
permissions:
  contents: read

# A newer push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      # Report every failing version, not just the first.
      fail-fast: false
      matrix:
        # 22 matches the Vercel runtime; 24 is Active LTS. The dependency
        # floor is Node 20.19+ / 22.12+ (vite is the strictest), but 20 is EOL.
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
