name: Feature request
description: Suggest an idea for Bookmark
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This project is intentionally small. Ideas that keep it focused on
        "track what I read" are most likely to land.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the reading workflow that feels awkward today.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a pull request for this
          required: false
