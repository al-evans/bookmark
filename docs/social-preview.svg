<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Bookmark social preview</title>
  <desc id="desc">Minimal Bookmark social preview with the app icon, headline, and a static reading progress card.</desc>
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <rect x="24" y="24" width="1152" height="582" rx="36" stroke="#E2E8F0" stroke-width="2"/>

  <g transform="translate(84 92)">
    <rect width="88" height="88" rx="22" fill="#EFF6FF"/>
    <path d="M29 19a4 4 0 0 1 4-4h22a4 4 0 0 1 4 4v52L44 60 29 71V19z" fill="#0F172A"/>
    <path d="M44 31l3.2 6.5 7.1 1-5.1 5 1.2 7.1-6.4-3.4-6.4 3.4 1.2-7.1-5.1-5 7.1-1L44 31z" fill="#EFF6FF"/>
  </g>

  <text x="84" y="266" fill="#0F172A" font-size="86" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="850" letter-spacing="-6">Track your</text>
  <text x="84" y="354" fill="#0F172A" font-size="86" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="850" letter-spacing="-6">reading.</text>
  <text x="88" y="426" fill="#475569" font-size="30" font-family="Inter, Segoe UI, Arial, sans-serif">Self-hosted on Vercel. Free by default.</text>
  <text x="88" y="470" fill="#475569" font-size="30" font-family="Inter, Segoe UI, Arial, sans-serif">Optional bring-your-own AI.</text>

  <g transform="translate(776 160)">
    <rect width="316" height="260" rx="28" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="24" y="54" fill="#0F172A" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="850">My Reading Goals</text>
    <circle cx="270" cy="42" r="24" fill="#1D4ED8"/>
    <path d="M270 30v24M258 42h24" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <rect x="24" y="90" width="268" height="118" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="40" y="108" width="52" height="78" rx="6" fill="#1D4ED8"/>
    <text x="108" y="136" fill="#0F172A" font-size="21" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="850">Project Hail Mary</text>
    <text x="108" y="164" fill="#475569" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif">by Andy Weir</text>
    <rect x="108" y="180" width="118" height="7" rx="3.5" fill="#E2E8F0"/>
    <rect x="108" y="180" width="80" height="7" rx="3.5" fill="#1D4ED8"/>
    <text x="238" y="188" fill="#1E40AF" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="850">68%</text>
  </g>
