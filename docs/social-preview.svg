<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Bookmark social preview</title>
  <desc id="desc">Social preview for Bookmark, showing the app icon, self-hosted setup message, and reading tracker UI.</desc>
  <defs>
    <linearGradient id="pageBg" x1="92" y1="0" x2="1092" y2="702" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.52" stop-color="#F1F5F9"/>
      <stop offset="1" stop-color="#E0E7FF"/>
    </linearGradient>
    <linearGradient id="coverA" x1="0" y1="0" x2="70" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="coverB" x1="0" y1="0" x2="70" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#pageBg)"/>
  <circle cx="1020" cy="90" r="260" fill="#1D4ED8" opacity="0.12"/>

  <g transform="translate(80 96)" filter="url(#shadow)">
    <rect width="86" height="86" rx="20" fill="#EFF6FF"/>
    <path d="M29 19a4 4 0 0 1 4-4h20a4 4 0 0 1 4 4v50L43 59 29 69V19z" fill="#0F172A"/>
    <path d="M43 31l3.2 6.5 7.1 1-5.1 5 1.2 7.1-6.4-3.4-6.4 3.4 1.2-7.1-5.1-5 7.1-1L43 31z" fill="#EFF6FF"/>
  </g>

  <text x="80" y="250" fill="#0F172A" font-size="76" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" letter-spacing="-4">Bookmark</text>
  <text x="82" y="334" fill="#0F172A" font-size="60" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" letter-spacing="-3">Your reading tracker.</text>
  <text x="82" y="402" fill="#0F172A" font-size="60" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" letter-spacing="-3">Your data.</text>
  <text x="84" y="468" fill="#475569" font-size="28" font-family="Inter, Segoe UI, Arial, sans-serif">Free self-hosted setup. Optional bring-your-own AI.</text>

  <g transform="translate(790 70)" filter="url(#shadow)">
    <rect width="310" height="450" rx="34" fill="#F1F5F9" stroke="#E2E8F0"/>
    <rect width="310" height="74" rx="34" fill="#0F172A"/>
    <path d="M0 50h310v24H0z" fill="#0F172A"/>
    <rect y="71" width="310" height="3" fill="#1D4ED8"/>
    <text x="22" y="46" fill="#FFFFFF" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">My Reading Goals</text>
    <circle cx="268" cy="36" r="24" fill="#1D4ED8"/>
    <path d="M268 24v24M256 36h24" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>

    <text x="18" y="116" fill="#0F172A" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">Currently Reading</text>
    <text x="206" y="116" fill="#94A3B8" font-size="17" font-family="Inter, Segoe UI, Arial, sans-serif">(1)</text>

    <g transform="translate(18 134)">
      <rect width="274" height="96" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="14" y="12" width="48" height="72" rx="4" fill="url(#coverA)"/>
      <path d="M24 28h28M24 42h20M24 56h26" stroke="#DBEAFE" stroke-width="4" stroke-linecap="round"/>
      <text x="76" y="39" fill="#0F172A" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">Project Hail Mary</text>
      <text x="76" y="64" fill="#475569" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif">by Andy Weir</text>
      <rect x="76" y="76" width="140" height="6" rx="3" fill="#E2E8F0"/>
      <rect x="76" y="76" width="95" height="6" rx="3" fill="#1D4ED8"/>
      <text x="226" y="82" fill="#1E40AF" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">68%</text>
    </g>

    <g transform="translate(18 238)">
      <rect width="274" height="96" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="14" y="12" width="48" height="72" rx="4" fill="url(#coverB)"/>
      <path d="M25 30h25M25 44h18M25 58h28" stroke="#EDE9FE" stroke-width="4" stroke-linecap="round"/>
      <text x="76" y="38" fill="#0F172A" font-size="17" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">Tomorrow, and</text>
      <text x="76" y="60" fill="#0F172A" font-size="17" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">Tomorrow...</text>
      <text x="76" y="82" fill="#475569" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif">by Gabrielle Zevin</text>
    </g>

    <rect y="396" width="310" height="54" fill="#0F172A"/>
    <rect x="14" y="404" width="96" height="38" rx="8" fill="#1D4ED8" opacity="0.38"/>
    <text x="34" y="427" fill="#FFFFFF" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">Reading</text>
    <text x="134" y="427" fill="#CBD5E1" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">Want</text>
    <text x="218" y="427" fill="#CBD5E1" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">Finished</text>
  </g>
</svg>
