<svg width="1600" height="480" viewBox="0 0 1600 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Bookmark banner</title>
  <desc id="desc">Minimal Bookmark banner with the app icon, headline, and a static reading progress card.</desc>
  <rect width="1600" height="480" rx="36" fill="#FFFFFF"/>
  <rect x="1" y="1" width="1598" height="478" rx="35" stroke="#E2E8F0" stroke-width="2"/>

  <g transform="translate(120 78)">
    <rect width="88" height="88" rx="22" fill="#EFF6FF"/>
    <path d="M29 19a4 4 0 0 1 4-4h22a4 4 0 0 1 4 4v52L44 60 29 71V19z" fill="#0F172A"/>
    <path d="M44 31l3.2 6.5 7.1 1-5.1 5 1.2 7.1-6.4-3.4-6.4 3.4 1.2-7.1-5.1-5 7.1-1L44 31z" fill="#EFF6FF"/>
  </g>

  <text x="120" y="252" fill="#0F172A" font-size="92" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="850" letter-spacing="-6">Track your reading.</text>
  <text x="124" y="320" fill="#475569" font-size="32" font-family="Inter, Segoe UI, Arial, sans-serif">Self-hosted on Vercel. Free by default. Optional AI.</text>

  <g transform="translate(1054 122)">
    <rect width="340" height="236" rx="24" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="24" y="52" fill="#0F172A" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="850">My Reading Goals</text>
    <circle cx="292" cy="42" r="24" fill="#1D4ED8"/>
    <path d="M292 30v24M280 42h24" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <rect x="24" y="84" width="292" height="112" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="40" y="100" width="52" height="78" rx="6" fill="#1D4ED8"/>
    <text x="108" y="128" fill="#0F172A" font-size="21" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="850">Project Hail Mary</text>
    <text x="108" y="156" fill="#475569" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif">by Andy Weir</text>
    <rect x="108" y="170" width="132" height="7" rx="3.5" fill="#E2E8F0"/>
    <rect x="108" y="170" width="90" height="7" rx="3.5" fill="#1D4ED8"/>
    <text x="252" y="178" fill="#1E40AF" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="850">68%</text>
  </g>
</svg>
