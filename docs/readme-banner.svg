  </g>
  <text x="464" y="194" fill="#F1F5F9" font-size="76" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Bookmark</text>
  <text x="464" y="250" fill="#93C5FD" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Track books, reading progress, and finished stats</text>
  <text x="464" y="306" fill="#CBD5E1" font-size="28" font-family="Segoe UI, Arial, sans-serif">React + Vite reading tracker with sync, reminders, and AI-powered helpers.</text>
