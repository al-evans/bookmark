<svg width="1600" height="480" viewBox="0 0 1600 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Bookmark banner</title>
  <desc id="desc">Bookmark brand banner with the same app-style reading tracker preview used on the website.</desc>
  <defs>
    <linearGradient id="pageBg" x1="160" y1="0" x2="1420" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.54" stop-color="#F9FAFB"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="coverA" x1="0" y1="0" x2="70" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="coverB" x1="0" y1="0" x2="70" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#111827" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1600" height="480" rx="36" fill="url(#pageBg)"/>
  <circle cx="1330" cy="84" r="260" fill="#4F46E5" opacity="0.12"/>

  <g transform="translate(112 72)" filter="url(#shadow)">
    <rect width="84" height="84" rx="20" fill="#EFF6FF"/>
    <path d="M28 18a4 4 0 0 1 4-4h20a4 4 0 0 1 4 4v50L42 58 28 68V18z" fill="#111827"/>
    <path d="M42 30l3.2 6.5 7.1 1-5.1 5 1.2 7.1-6.4-3.4-6.4 3.4 1.2-7.1-5.1-5 7.1-1L42 30z" fill="#EFF6FF"/>
  </g>

  <text x="112" y="222" fill="#111827" font-size="82" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" letter-spacing="-4">Track your reading.</text>
  <text x="112" y="304" fill="#111827" font-size="82" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" letter-spacing="-4">Self-hosted.</text>
  <text x="116" y="366" fill="#475569" font-size="30" font-family="Inter, Segoe UI, Arial, sans-serif">Free self-hosted setup. Optional bring-your-own AI.</text>

  <g transform="translate(1048 48)" filter="url(#shadow)">
    <rect width="330" height="386" rx="34" fill="#F9FAFB" stroke="#E5E7EB"/>
    <rect width="330" height="74" rx="34" fill="#111827"/>
    <path d="M0 50h330v24H0z" fill="#111827"/>
    <rect y="71" width="330" height="3" fill="#4F46E5"/>
    <text x="24" y="46" fill="#FFFFFF" font-size="25" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">My Reading Goals</text>
    <circle cx="286" cy="36" r="24" fill="#4F46E5"/>
    <path d="M286 24v24M274 36h24" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>

    <text x="18" y="116" fill="#111827" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">Currently Reading</text>
    <text x="206" y="116" fill="#94A3B8" font-size="17" font-family="Inter, Segoe UI, Arial, sans-serif">(1)</text>

    <g transform="translate(18 134)">
      <rect width="294" height="96" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
      <rect x="14" y="12" width="48" height="72" rx="4" fill="url(#coverA)"/>
      <path d="M24 28h28M24 42h20M24 56h26" stroke="#DBEAFE" stroke-width="4" stroke-linecap="round"/>
      <text x="76" y="39" fill="#111827" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">Project Hail Mary</text>
      <text x="76" y="64" fill="#475569" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif">by Andy Weir</text>
      <rect x="76" y="76" width="150" height="6" rx="3" fill="#E5E7EB"/>
      <rect x="76" y="76" width="102" height="6" rx="3" fill="#4F46E5"/>
      <text x="236" y="82" fill="#4338CA" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">68%</text>
    </g>

    <g transform="translate(18 238)">
      <rect width="294" height="96" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
      <rect x="14" y="12" width="48" height="72" rx="4" fill="url(#coverB)"/>
      <path d="M25 30h25M25 44h18M25 58h28" stroke="#EDE9FE" stroke-width="4" stroke-linecap="round"/>
      <text x="76" y="38" fill="#111827" font-size="17" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">Tomorrow, and Tomorrow,</text>
      <text x="76" y="60" fill="#111827" font-size="17" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">and Tomorrow</text>
      <text x="76" y="82" fill="#475569" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif">by Gabrielle Zevin</text>
    </g>

    <rect y="332" width="330" height="54" fill="#111827"/>
    <rect x="14" y="340" width="96" height="38" rx="8" fill="#4F46E5" opacity="0.44"/>
    <text x="34" y="363" fill="#FFFFFF" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">Reading</text>
    <text x="142" y="363" fill="#CBD5E1" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">Want</text>
    <text x="236" y="363" fill="#CBD5E1" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">Finished</text>
  </g>
</svg>
